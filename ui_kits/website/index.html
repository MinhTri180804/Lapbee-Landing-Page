<script type="text/babel">
const { Toast } = window.LAPBEEDesignSystem_7efb49;
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
function App(){
  const init = (localStorage.getItem("lb-route")||"home|").split("|");
  const [r,setR] = React.useState({page:init[0],id:+init[1]||null}); const [t,setT] = React.useState(null);
  const go = (page,id=null) => { window.lbScrollTo ? window.lbScrollTo(0,{immediate:true}) : window.scrollTo(0,0); setR({page,id,n:Date.now()}); localStorage.setItem("lb-route",page+"|"+(id||"")); };
  React.useLayoutEffect(() => { window.scrollTo(0,0); window.lbScrollTo && window.lbScrollTo(0,{immediate:true}); requestAnimationFrame(()=>{ window.scrollTo(0,0); window.lbScrollTo && window.lbScrollTo(0,{immediate:true}); }); const t = setTimeout(()=>{ if (scrollY > 0) { window.lbScrollTo ? window.lbScrollTo(0,{immediate:true}) : window.scrollTo(0,0); } }, 120); return () => clearTimeout(t); }, [r.page, r.id, r.n]);
  const toast = (m) => { setT(m); setTimeout(()=>setT(null),2400); };
  const P = {home:Home,team:Team,history:History,posts:Posts,post:Post,book:Booking}[r.page]||Home;
  const navPage = r.page==="post"?"posts":r.page;
  return <><div className="lb-progress" aria-hidden="true"></div><Header page={navPage} go={go}/><P go={go} id={r.id} toast={toast}/><Footer go={go}/>
    {t && <div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",zIndex:80,width:"calc(100% - 40px)",maxWidth:380}}><Toast title={t}/></div>}</>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
