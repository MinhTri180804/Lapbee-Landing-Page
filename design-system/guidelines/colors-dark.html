<!-- @dsCard group="Colors" viewport="700x230" name="Dark theme" subtitle="data-theme=&quot;dark&quot; on <html>: flipped ink ramp, bands stay dark" -->
<!DOCTYPE html><html lang="vi" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page);color:var(--fg-1)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.s{border-radius:var(--radius-md);height:120px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--border-1);font-size:13px;font-weight:600}.v{font-family:var(--font-mono);font-size:10px;font-weight:400;opacity:.8}</style></head><body>
<div class="g">
<div class="s" style="background:var(--surface-page)">Page<span class="v">--surface-page<br>#121110</span></div>
<div class="s" style="background:var(--surface-card)">Card<span class="v">--surface-card<br>#1A1917</span></div>
<div class="s" style="background:var(--ink-950);color:var(--fg-inverse-1)">Strong<span class="v" style="color:var(--accent-on-strong);opacity:1">--ink-950 + accent-on-strong</span></div>
<div class="s" style="background:var(--brand);color:var(--on-brand);border-color:var(--brand)">Bee<span class="v">--brand / --on-brand</span></div>
<div class="s" style="background:var(--band-bg);color:var(--band-fg)">Band<span class="v" style="color:var(--band-accent)">--band-bg / accent</span></div>
</div>
<div style="display:flex;gap:18px;margin-top:16px;font-size:14px"><span>fg-1</span><span style="color:var(--fg-2)">fg-2</span><span style="color:var(--fg-3)">fg-3</span><span style="color:var(--success)">success</span><span style="color:var(--danger)">danger</span><span style="color:var(--info)">info</span><span style="color:var(--warning)">warning</span></div>
</body></html>
