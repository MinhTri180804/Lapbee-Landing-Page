<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--surface-page)}.row{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.c{height:64px;border-radius:var(--radius-sm)}.l{font-size:13px;font-weight:600}.v{font-family:var(--font-mono);font-size:11px;color:var(--fg-2)}</style></head><body>
<div class="row" style="grid-template-columns:repeat(4,1fr)"><div class="s"><div style="display:flex;height:64px;border-radius:var(--radius-sm);overflow:hidden"><div style="flex:1;background:var(--success)"></div><div style="flex:1;background:var(--success-soft)"></div></div><div class="l">Thành công</div><div class="v">--success / --success-soft</div></div><div class="s"><div style="display:flex;height:64px;border-radius:var(--radius-sm);overflow:hidden"><div style="flex:1;background:var(--danger)"></div><div style="flex:1;background:var(--danger-soft)"></div></div><div class="l">Lỗi</div><div class="v">--danger / --danger-soft</div></div><div class="s"><div style="display:flex;height:64px;border-radius:var(--radius-sm);overflow:hidden"><div style="flex:1;background:var(--info)"></div><div style="flex:1;background:var(--info-soft)"></div></div><div class="l">Thông tin</div><div class="v">--info / --info-soft</div></div><div class="s"><div style="display:flex;height:64px;border-radius:var(--radius-sm);overflow:hidden"><div style="flex:1;background:var(--warning)"></div><div style="flex:1;background:var(--warning-soft)"></div></div><div class="l">Lưu ý</div><div class="v">--warning / --warning-soft</div></div></div>
</body></html>
